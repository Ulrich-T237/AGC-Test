# AGC Assurances - RCA issuing app (Render Blueprint, FREE tier).
# Deploy: Render dashboard > New > Blueprint > connect this repo.
#
# FREE-TIER REALITY (read before using online):
# - The service SLEEPS after 15 min without visitors; first visit
#   afterwards takes ~1 min to wake up.
# - Storage is EPHEMERAL (no disk on free): the customer registry and
#   generated files are WIPED on every restart/redeploy. Always download
#   your PDFs immediately; the office PC is the real archive.
# - Open mode (v5.3+): the app has NO login screen. Anyone with the URL
#   can use it. Keep the link private, test data only.
services:
  - type: web
    name: agc-rca
    runtime: docker
    plan: free
    region: frankfurt
    envVars:
      - key: STORAGE_DIR
        value: /data
      - key: OMP_NUM_THREADS
        value: 1
      - key: OPENBLAS_NUM_THREADS
        value: 1
